name: Build Lain42 Agent Server

on:
  push:
    branches:
      - agent-ui
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'relaykit/**'
      - 'web/**'
      - 'VERSION'
      - '.deploy/Dockerfile.agent-flat'
      - '.github/workflows/lain42-agent-server.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to package (defaults to the triggering revision)
        required: false
        type: string
      evaluate_only:
        description: Run bounded live-model context checks without packaging or deployment
        required: false
        default: false
        type: boolean
      evaluation_model:
        description: An allowlisted model already accessible to the evaluation account
        required: false
        default: nvidia/nemotron-3-super-120b-a12b
        type: string
      evaluation_kind:
        description: Choose task continuity or real public-data grounding (not website OAuth E2E)
        required: false
        default: continuity
        type: choice
        options:
          - continuity
          - grounding
          - workflow
          - dsh-prototype
          - dsh-research
          - dsh-client-research
          - dsh-hosted-research
          - prototype-catalog

permissions:
  contents: read

concurrency:
  group: agent-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.evaluate_only }}
    name: Build Linux amd64 server artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
      GOWORK: 'off'
      GOOS: linux
      GOARCH: amd64
      GOEXPERIMENT: greenteagc
      GOPROXY: https://goproxy.cn,direct
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: DISABLE_ESLINT_PLUGIN=true bun run build:check

      - name: Test frontend
        working-directory: web
        run: bun run test

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Test agent API
        run: go test ./service ./controller

      - name: Test agent device re-pair lifecycle
        run: go test ./model -run 'Test(CreateAgentPairingScopesReplacementToTheCurrentUser|ListAgentDevicesOnlyReturnsTheRequestingUsersDevices|RevokeAgentDeviceIsScopedToTheRequestingUser|RedeemAgentPairingRotatesCredentialAndPreservesDeviceRecord|RedeemAgentPairingFailsIfReplacementWasRevoked|AgentRunEventsAreScopedToBothUserAndDevice)'

      - name: Build Linux amd64 server
        id: build-server
        shell: bash
        run: |
          mkdir -p dist
          source_sha="$(git rev-parse HEAD)"
          source_short="$(git rev-parse --short=7 HEAD)"
          version="agent-${source_short}"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          go build -trimpath \
            -ldflags "-s -w -X github.com/QuantumNous/new-api/common.Version=${version}" \
            -o dist/new-api-linux-amd64 .
          file dist/new-api-linux-amd64
          sha256sum dist/new-api-linux-amd64

      - name: Package clean runtime image
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/lain42-agent-image"
          mkdir -p "$stage" dist
          cp dist/new-api-linux-amd64 "$stage/new-api"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$stage/"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.deploy/Dockerfile.agent-flat" > "$stage/Dockerfile"

          source_sha="$(git rev-parse HEAD)"
          source_short="$(git rev-parse --short=7 HEAD)"
          image_tag="lain42/new-api:agent-flat-${source_short}"
          docker build --pull --tag "$image_tag" "$stage"

          image_size=$(docker image inspect --format='{{.Size}}' "$image_tag")
          layer_count=$(docker image inspect --format='{{len .RootFS.Layers}}' "$image_tag")
          if (( image_size > 1073741824 )); then
            echo "::error::Clean runtime image is unexpectedly large: ${image_size} bytes"
            exit 1
          fi
          if (( layer_count > 8 )); then
            echo "::error::Clean runtime image has unexpected layer history: ${layer_count} layers"
            exit 1
          fi

          image_archive="dist/lain42-new-api-agent-flat-${source_sha}-linux-amd64.tar.gz"
          docker save "$image_tag" | gzip -1 > "$image_archive"
          sha256sum "$image_archive"
          echo "Clean runtime image: $image_tag; size=${image_size}; layers=${layer_count}"

      - name: Upload server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lain42-agent-server-linux-amd64-${{ steps.build-server.outputs.source_sha }}
          path: dist/new-api-linux-amd64
          if-no-files-found: error
          retention-days: 14

      - name: Upload clean runtime image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lain42-new-api-clean-image-${{ steps.build-server.outputs.source_sha }}
          path: dist/lain42-new-api-agent-flat-${{ steps.build-server.outputs.source_sha }}-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  evaluate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluate_only && inputs.evaluation_kind != 'dsh-prototype' && inputs.evaluation_kind != 'dsh-research' && inputs.evaluation_kind != 'dsh-client-research' && inputs.evaluation_kind != 'dsh-hosted-research' && inputs.evaluation_kind != 'prototype-catalog' && github.repository == 'lilyco-42/new-api' && github.ref == 'refs/heads/feat/agent-dsh-control-plane' }}
    name: Live model task continuity (limited scope)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      checks: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - name: Check evaluation types and lint
        run: |
          bunx tsgo -p tsconfig.agent-evaluation.json
          bunx oxlint -c .oxlintrc.json scripts/evaluate-agent-context.ts scripts/agent-live-grounding.evaluation.ts scripts/agent-workflow-live.evaluation.ts vitest.agent-live.config.ts src/features/agent/agent-prompts.ts
      - name: Set up Go for the real workflow evidence reader
        if: ${{ inputs.evaluation_kind == 'workflow' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Read an actual historical failed run through the production service
        if: ${{ inputs.evaluation_kind == 'workflow' }}
        working-directory: .
        env:
          GOWORK: 'off'
          LAIN42_WORKFLOW_LIVE_EVALUATION: '1'
          LAIN42_WORKFLOW_READ_TOKEN: ${{ github.token }}
          LAIN42_WORKFLOW_RUN_ID: '36975489097'
          LAIN42_WORKFLOW_EVIDENCE_FILE: ${{ runner.temp }}/workflow-evidence.json
        run: go test ./service -run '^TestAgentWorkflowEvidenceLiveRead$' -count=1 -timeout=60s
      - name: Evaluate three bounded requests against the website model
        if: ${{ inputs.evaluation_kind == 'continuity' }}
        env:
          LAIN42_AGENT_EVAL_API_KEY: ${{ secrets.LAIN42_AGENT_EVAL_API_KEY }}
          LAIN42_AGENT_EVAL_MODEL: ${{ inputs.evaluation_model }}
        run: bunx vitest run --config vitest.agent-live.config.ts scripts/evaluate-agent-context.ts
      - name: Evaluate two real public GitHub reads through the candidate provider and website model
        if: ${{ inputs.evaluation_kind == 'grounding' }}
        env:
          LAIN42_AGENT_EVAL_API_KEY: ${{ secrets.LAIN42_AGENT_EVAL_API_KEY }}
          LAIN42_AGENT_EVAL_MODEL: ${{ inputs.evaluation_model }}
        run: bunx vitest run --config vitest.agent-live.config.ts scripts/agent-live-grounding.evaluation.ts
      - name: Diagnose real workflow evidence with one website inference request
        if: ${{ inputs.evaluation_kind == 'workflow' }}
        env:
          LAIN42_AGENT_EVAL_API_KEY: ${{ secrets.LAIN42_AGENT_EVAL_API_KEY }}
          LAIN42_AGENT_EVAL_MODEL: ${{ inputs.evaluation_model }}
          LAIN42_WORKFLOW_EVIDENCE_FILE: ${{ runner.temp }}/workflow-evidence.json
        run: bunx vitest run --config vitest.agent-live.config.ts scripts/agent-workflow-live.evaluation.ts
      - name: Preserve synthetic evaluation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-context-evaluation-${{ github.sha }}
          path: web/evaluation-results/*.json
          if-no-files-found: error
          retention-days: 7

  dsh-prototype:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluate_only && (inputs.evaluation_kind == 'dsh-prototype' || inputs.evaluation_kind == 'dsh-research' || inputs.evaluation_kind == 'dsh-client-research' || inputs.evaluation_kind == 'dsh-hosted-research') && github.repository == 'lilyco-42/new-api' && github.ref == 'refs/heads/feat/agent-dsh-control-plane' }}
    name: Actual DSH and New API with bounded trial inference
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOWORK: 'off'
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact New API candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the dedicated authorized prototype key
        env:
          PROTOTYPE_KEY: ${{ secrets.LAIN42_PROTOTYPE_NVIDIA_KEY }}
        shell: bash
        run: |
          if [[ "$PROTOTYPE_KEY" != nvapi-* ]]; then
            echo '::error::The authorized NVIDIA prototype credential is missing. This gate does not skip or fall back to a paid provider.'
            exit 1
          fi
      - name: Checkout supported pinned DSH
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: lilyco-42/deepseek-harness
          ref: 5abc327fb1092d1f357975bb38efeb83910e7063
          path: .ci-dsh
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Set up DSH package manager
        uses: pnpm/action-setup@v4
        with:
          package_json_file: .ci-dsh/package.json
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: .ci-dsh/pnpm-lock.yaml
      - name: Install native compiler
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Build the immutable actual DSH runtime
        working-directory: .ci-dsh
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Set up frontend package manager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - name: Build the actual frontend for mobile real-model acceptance
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
      - name: Install Chromium for mobile emulation
        working-directory: .ci-dsh
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Check prototype formatting
        run: test -z "$(gofmt -l agent_dsh_live_prototype_test.go agent_dsh_composition_test.go)"
      - name: Verify real inference, Issue continuation, context, attachment, replay and owner wallet
        env:
          LAIN42_PROTOTYPE_NVIDIA_KEY: ${{ secrets.LAIN42_PROTOTYPE_NVIDIA_KEY }}
          LAIN42_COMPOSITION_DSH_ROOT: ${{ github.workspace }}/.ci-dsh
          LAIN42_PROTOTYPE_EVIDENCE_DIR: ${{ runner.temp }}/lain42-prototype-evidence
          LAIN42_RESEARCH_DOCUMENT_URL: https://raw.githubusercontent.com/lilyco-42/new-api/${{ github.sha }}/testdata/lain42-browser-research.html
          EVALUATION_KIND: ${{ inputs.evaluation_kind }}
        run: |
          node --check scripts/lain42-live-browser-acceptance.mjs
          node --check scripts/lain42-live-research-acceptance.mjs
          if [[ "$EVALUATION_KIND" == 'dsh-client-research' ]]; then
            go test -tags 'lain42composition lain42live' . -run '^TestLiveDSHNewAPIClientResearchPrototype$' -count=1 -v -timeout=6m
          elif [[ "$EVALUATION_KIND" == 'dsh-hosted-research' ]]; then
            go test -tags 'lain42composition lain42live' . -run '^TestLiveDSHNewAPIHostedResearchPrototype$' -count=1 -v -timeout=6m
          elif [[ "$EVALUATION_KIND" == 'dsh-research' ]]; then
            go test -tags 'lain42composition lain42live' . -run '^TestLiveDSHNewAPIResearchPrototype$' -count=1 -v -timeout=6m
          else
            go test -tags 'lain42composition lain42live' . -run '^TestLiveDSHNewAPIPrototype$' -count=1 -v -timeout=6m
          fi
      - name: Save only whitelisted synthetic prototype evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lain42-real-prototype-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lain42-prototype-evidence/prototype.json
            ${{ runner.temp }}/lain42-prototype-evidence/mobile-real-model.png
            ${{ runner.temp }}/lain42-prototype-evidence/mobile-account-b.png
            ${{ runner.temp }}/lain42-prototype-evidence/mobile-public-search.png
            ${{ runner.temp }}/lain42-prototype-evidence/mobile-wasm-page.png
          if-no-files-found: warn
          retention-days: 7

  prototype-catalog:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluate_only && inputs.evaluation_kind == 'prototype-catalog' && github.repository == 'lilyco-42/new-api' && github.ref == 'refs/heads/feat/agent-dsh-control-plane' }}
    name: Read prototype catalog metadata (not inference acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read only fixed candidate model presence
        env:
          LAIN42_PROTOTYPE_NVIDIA_KEY: ${{ secrets.LAIN42_PROTOTYPE_NVIDIA_KEY }}
          LAIN42_PROTOTYPE_EVIDENCE_DIR: ${{ runner.temp }}/lain42-prototype-catalog
        run: python3 scripts/lain42-prototype-catalog.py
      - name: Save whitelisted metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lain42-prototype-catalog-${{ github.sha }}
          path: ${{ runner.temp }}/lain42-prototype-catalog/catalog.json
          if-no-files-found: error
          retention-days: 7
