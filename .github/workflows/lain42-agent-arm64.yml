name: Build Lain42 Agent ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build linux-arm64 (Radxa)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@34d2323c40447f79d77146d8269c123a27f4ced5 # main 2026-09-21

      - name: Install Tauri CLI
        run: |
          cargo binstall --no-confirm --locked tauri-cli@2.11.5 || \
            cargo install tauri-cli --version 2.11.5 --locked

      - name: Check and test
        working-directory: tauri
        run: |
          cargo fmt --all --check
          cargo test --locked
          cargo test --manifest-path agent-session/Cargo.toml --locked

      - name: Build Debian package
        working-directory: tauri
        run: cargo tauri build --bundles deb

      - name: Upload ARM64 package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lain42-agent-linux-arm64
          if-no-files-found: error
          path: tauri/target/release/bundle/**/*.deb

