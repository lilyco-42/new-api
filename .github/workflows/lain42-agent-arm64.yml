name: Build Lain42 Agent ARM64

on:
  push:
    branches:
      - agent-ui
    paths:
      - 'tauri/agent-companion/**'
      - 'tauri/src/tool_runtime.rs'
      - '.github/workflows/lain42-agent-arm64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build linux-arm64 (Radxa)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Check and test
        working-directory: tauri/agent-companion
        run: |
          cargo fmt --all --check
          cargo test --locked

      - name: Build headless Radxa companion
        working-directory: tauri/agent-companion
        run: cargo build --release --locked

      - name: Upload headless companion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lain42-agent-companion-linux-arm64
          if-no-files-found: error
          path: tauri/agent-companion/target/release/lain42-agent-companion
